[package]
name = "inspirum-terminal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "An early native SSH terminal using system OpenSSH"
repository = "https://github.com/garyz-inspirum/inspirum-terminal"
readme = "README.md"
keywords = ["ssh", "terminal", "egui", "openssh"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = []
iced-ui = ["dep:iced"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
directories = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_term = { path = "vendor/egui_term" }
iced = { version = "=0.14.0", optional = true, default-features = false, features = ["tiny-skia", "x11", "thread-pool", "crisp", "canvas", "advanced-shaping"] }

[profile.dev]
debug = 0

[patch.crates-io]
dispatch = { path = "vendor/dispatch-compat" }
