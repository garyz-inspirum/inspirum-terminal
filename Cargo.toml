[package]
name = "inspirum-terminal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "An early native SSH terminal using system OpenSSH"
repository = "https://github.com/garyz-inspirum/inspirum-terminal"
readme = "README.md"
keywords = ["ssh", "terminal", "iced", "openssh"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = ["iced-ui"]
iced-ui = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
directories = "6"
terminal_core = { package = "inspirum-terminal-core", path = "vendor/terminal-core" }
# Enable the Metal/WGPU backend on macOS and retain tiny-skia as a fallback.
# The third-party notice verifier must pass for this native target before
# enabling GPU acceleration in distributed builds; never waive license checks.
[target.'cfg(not(target_os = "macos"))'.dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "x11", "wayland", "thread-pool", "crisp", "canvas", "advanced-shaping", "advanced"] }

[target.'cfg(target_os = "macos")'.dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "thread-pool", "crisp", "canvas", "advanced-shaping", "advanced"] }

[profile.dev]
debug = 0

[patch.crates-io]
dispatch = { path = "vendor/dispatch-compat" }
