name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
            binary: inspirum-terminal
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            python: python
            binary: inspirum-terminal.exe
          - os: macos-15
            target: aarch64-apple-darwin
            python: python3
            binary: inspirum-terminal
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Assert native architecture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(rustc -vV | sed -n 's/^host: //p')"
          test "$actual" = "${{ matrix.target }}" || {
            echo "expected native host ${{ matrix.target }}, got $actual" >&2
            exit 1
          }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --target ${{ matrix.target }}
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Test (Windows, bounded per target)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked --target ${{ matrix.target }} --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $targets = @('lib', 'app', 'controlmaster', 'diagnostics_cli', 'native_ssh_smoke', 'profile_import_safety', 'proxy_cli', 'proxy_transport', 'scp', 'sessions', 'sftp_policy', 'ssh_integration', 'terminal', 'terminal_compat', 'tunnel_manager')
          foreach ($target in $targets) {
            Write-Host "::group::cargo test target: $target"
            if ($target -eq 'lib') {
              $args = @('test', '--locked', '--target', '${{ matrix.target }}', '--lib')
            } else {
              $args = @('test', '--locked', '--target', '${{ matrix.target }}', '--test', $target)
            }
            $process = Start-Process cargo -ArgumentList $args -NoNewWindow -PassThru
            if (-not $process.WaitForExit(120000)) {
              Write-Error "Timed out after 120 seconds: $target"
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              exit 124
            }
            if ($process.ExitCode -ne 0) {
              Write-Error "Test target failed: $target (exit $($process.ExitCode))"
              exit $process.ExitCode
            }
            Write-Host "::endgroup::"
          }
      - name: Clippy
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Collect release dependency notices
        env:
          TARGET: ${{ matrix.target }}
        run: ${{ matrix.python }} scripts/collect-third-party-notices.py --target "$env:TARGET" --output "dist/notices/${{ matrix.target }}/THIRD_PARTY_NOTICES"
        if: runner.os == 'Windows'
      - name: Collect release dependency notices (Unix)
        env:
          TARGET: ${{ matrix.target }}
        run: ${{ matrix.python }} scripts/collect-third-party-notices.py --target "$TARGET" --output "dist/notices/${{ matrix.target }}/THIRD_PARTY_NOTICES"
        if: runner.os != 'Windows'
      - name: Install native SSH fixture dependency (Linux)
        if: runner.os == 'Linux'
        run: python3 -m pip install --disable-pip-version-check "asyncssh==2.24.0"
      - name: Install native SSH fixture dependency (macOS)
        if: runner.os == 'macOS'
        run: python3 -m pip install --disable-pip-version-check --break-system-packages "asyncssh==2.24.0"
      - name: Install native SSH fixture dependency (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check "asyncssh==2.24.0"
      - name: Native authenticated SSH smoke (Unix)
        if: runner.os != 'Windows'
        env:
          INSPIRUM_TEST_TMPDIR: ${{ runner.temp }}
        run: python3 scripts/test-native-ssh-smoke.py
      - name: Native authenticated SSH smoke (Windows)
        if: runner.os == 'Windows'
        env:
          INSPIRUM_TEST_TMPDIR: ${{ runner.temp }}
        run: python scripts/test-native-ssh-smoke.py
      - name: Test workflow helper scripts
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Install isolated SSH test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server tmux xvfb xauth x11-utils
          sudo mkdir -p /run/sshd
      - name: Authenticated SSH integration
        if: runner.os == 'Linux'
        env:
          INSPIRUM_TEST_TMPDIR: ${{ runner.temp }}
        run: scripts/test-ssh-integration.sh
      - name: Install disposable Kerberos fixture dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get install -y krb5-kdc krb5-admin-server krb5-user
      - name: Real GSSAPI and delegation acceptance (isolated KDC)
        if: runner.os == 'Linux'
        env:
          INSPIRUM_TEST_TMPDIR: ${{ runner.temp }}
        run: python3 -B scripts/test-native-gssapi.py
      - name: Build CI release candidate
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package CI release candidate
        env:
          CI_TAG: ci-${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: ${{ matrix.python }} scripts/package-release.py --target "$env:TARGET" --tag "$env:CI_TAG" --commit "${{ github.sha }}" --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" --notices "dist/notices/${{ matrix.target }}/THIRD_PARTY_NOTICES" --output-dir "dist/packages"
        if: runner.os == 'Windows'
      - name: Package CI release candidate (Unix)
        env:
          CI_TAG: ci-${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: ${{ matrix.python }} scripts/package-release.py --target "$TARGET" --tag "$CI_TAG" --commit "${{ github.sha }}" --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" --notices "dist/notices/${{ matrix.target }}/THIRD_PARTY_NOTICES" --output-dir "dist/packages"
        if: runner.os != 'Windows'
      - name: Upload CI release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-release-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 2

  package-verify:
    name: verify-${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            python: python
          - os: macos-15
            target: aarch64-apple-darwin
            python: python3
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download CI release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-release-${{ matrix.target }}
          path: downloaded
      - name: Verify downloaded clean-install package
        env:
          CI_TAG: ci-${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: ${{ matrix.python }} scripts/verify-release-package.py --archive-dir downloaded --target "$env:TARGET" --tag "$env:CI_TAG" --commit "${{ github.sha }}" --work-parent "${{ runner.temp }}"
        if: runner.os == 'Windows'
      - name: Verify downloaded clean-install package (Unix)
        env:
          CI_TAG: ci-${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: ${{ matrix.python }} scripts/verify-release-package.py --archive-dir downloaded --target "$TARGET" --tag "$CI_TAG" --commit "${{ github.sha }}" --work-parent "${{ runner.temp }}"
        if: runner.os != 'Windows'
