name: Refresh Iced lockfile

on:
  push:
    branches:
      - design/78-iced-native-prototype
    paths:
      - Cargo.toml
      - .github/workflows/refresh-iced-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/78-iced-native-prototype
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Regenerate Cargo.lock
        run: cargo generate-lockfile
      - name: Commit updated lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(gui): refresh lockfile for Iced canvas"
          git push origin HEAD:design/78-iced-native-prototype
